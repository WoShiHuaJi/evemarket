name: Update LP store data

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-lp.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain src/data/lp-offers.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/lp-offers.json
            git commit -m "chore: weekly LP store data update"
            git push
          else
            echo "no changes"
          fi
